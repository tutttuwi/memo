<!DOCTYPE html>
<html data-bs-theme="auto">

<head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Marked (Markdown parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            background-color: var(--bs-body-bg);
        }

        .card {
            border-radius: 1rem;
        }

        textarea {
            resize: vertical;
        }

        #preview {
            max-height: 300px;
            overflow-y: auto;
            background: var(--bs-tertiary-bg);
            padding: 1rem;
            border-radius: .5rem;
        }
    </style>
</head>

<body>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0">📘 Study Log Input</h4>
                            <button class="btn btn-sm btn-outline-secondary" id="toggleTheme">
                                🌗
                            </button>
                        </div>

                        <!-- Category -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category</label>
                            <select id="category" class="form-select">
                                <option value="english">English</option>
                                <option value="it">IT</option>
                            </select>
                        </div>

                        <!-- Commit Title -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Commit Title (optional)</label>
                            <input type="text" id="commitTitle" class="form-control"
                                placeholder="Short summary (optional)">
                        </div>

                        <!-- Content -->
                        <div class="mb-2">
                            <label class="form-label fw-semibold">Content</label>
                            <textarea id="content" class="form-control" rows="8"
                                placeholder="Write your study memo here... (Ctrl + Enter to submit)"></textarea>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2 mb-3">
                            <button id="voiceBtn" class="btn btn-outline-primary">
                                🎤 Voice
                            </button>

                            <button id="clearHistoryBtn" class="btn btn-outline-danger">
                                🗑 Clear History
                            </button>
                        </div>

                        <!-- Preview -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Markdown Preview</label>
                            <div id="preview"></div>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid">
                            <button id="submitBtn" class="btn btn-primary btn-lg">
                                Save to GitHub
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="position-fixed bottom-0 end-0 p-3">
        <div id="successToast" class="toast text-bg-success border-0">
            <div class="toast-body">✅ 更新成功！</div>
        </div>
        <div id="errorToast" class="toast text-bg-danger border-0">
            <div class="toast-body">❌ エラー発生</div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        /* =============================
           Dark Mode Auto + Toggle
        ============================= */
        const html = document.documentElement;

        function setTheme(theme) {
            html.setAttribute("data-bs-theme", theme);
        }

        function detectSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark' : 'light';
        }

        const savedTheme = localStorage.getItem("theme");
        setTheme(savedTheme || detectSystemTheme());

        document.getElementById("toggleTheme").onclick = () => {
            const current = html.getAttribute("data-bs-theme");
            const next = current === "dark" ? "light" : "dark";
            setTheme(next);
            localStorage.setItem("theme", next);
        };

        /* =============================
           Local Storage Draft Save
        ============================= */
        const textarea = document.getElementById("content");
        textarea.value = localStorage.getItem("draft") || "";

        textarea.addEventListener("input", () => {
            localStorage.setItem("draft", textarea.value);
            updatePreview();
        });

        /* =============================
           Markdown Preview
        ============================= */
        function updatePreview() {
            document.getElementById("preview").innerHTML =
                marked.parse(textarea.value);
        }
        updatePreview();

        /* =============================
           Ctrl + Enter Submit
        ============================= */
        textarea.addEventListener("keydown", function (e) {
            if (e.ctrlKey && e.key === "Enter") {
                submit();
            }
        });

        /* =============================
           Voice Input
        ============================= */
        const voiceBtn = document.getElementById("voiceBtn");
        let recognition;

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = "ja-JP";
            recognition.continuous = false;

            recognition.onresult = function (event) {
                textarea.value += event.results[0][0].transcript;
                localStorage.setItem("draft", textarea.value);
                updatePreview();
            };

            voiceBtn.onclick = () => recognition.start();
        } else {
            voiceBtn.disabled = true;
        }

        /* =============================
           Clear History
        ============================= */
        document.getElementById("clearHistoryBtn").onclick = () => {
            localStorage.removeItem("draft");
            textarea.value = "";
            updatePreview();
        };

        /* =============================
           Submit
        ============================= */
        const successToast = new bootstrap.Toast(document.getElementById("successToast"));
        const errorToast = new bootstrap.Toast(document.getElementById("errorToast"));
        const submitBtn = document.getElementById("submitBtn");

        function submit() {
            const category = document.getElementById("category").value;
            const content = textarea.value.trim();
            const commitTitle = document.getElementById("commitTitle").value;

            if (!content) {
                showError("⚠ 内容を入力してください");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";

            google.script.run
                .withSuccessHandler(function () {
                    textarea.value = "";
                    document.getElementById("commitTitle").value = "";
                    localStorage.removeItem("draft");
                    updatePreview();
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Save to GitHub";
                    successToast.show();
                })
                .withFailureHandler(function (error) {
                    showError(error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Save to GitHub";
                })
                .submitForm(category, content, commitTitle);
        }

        function showError(msg) {
            document.querySelector("#errorToast .toast-body").innerText = msg;
            errorToast.show();
        }

        submitBtn.onclick = submit;
    </script>

</body>

</html>
